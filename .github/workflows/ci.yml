name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Catches changes outside the repository, such as the runner image.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # The images compose.yaml and @kutur-kit/testcontainers use, as services:
    # tests reach them through TEST_POSTGRES_URL and TEST_S3_* instead of
    # starting containers.
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: kit
          POSTGRES_PASSWORD: kit
          POSTGRES_DB: kit
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U kit -d kit"
          --health-interval 1s
          --health-timeout 2s
          --health-retries 30
      # The image has no shell tools for a health check; it starts in about a
      # second, well before the build finishes. It runs as a user that cannot
      # write to a tmpfs, so its data stays in the disposable container.
      rustfs:
        image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
        env:
          RUSTFS_ACCESS_KEY: kit
          RUSTFS_SECRET_KEY: kit-secret
        ports:
          - 9000:9000
    env:
      TEST_POSTGRES_URL: postgres://kit:kit@localhost:5432/kit
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_S3_ACCESS_KEY_ID: kit
      TEST_S3_SECRET_ACCESS_KEY: kit-secret
      # Pull requests reuse Turbo's cache and run only what their changes
      # affect. Every other run executes all tasks, refreshing that cache.
      TURBO_FORCE: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Commit messages are checked from the pull request's base.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --strict --from "$BASE" --to "$HEAD"
      - run: pnpm build
      - run: pnpm check
