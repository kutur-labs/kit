name: Setup
description: Installs the pinned Node and pnpm, the workspace's dependencies and Turbo's last cache.

runs:
  using: composite
  steps:
    # Installs the pnpm version, and checks the hash, in packageManager.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    # Caches pnpm's store, keyed by the lockfile.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    # A cache entry cannot be overwritten, so each commit saves its own and
    # restores the latest one before it; Turbo then skips unchanged tasks.
    # Pull requests read their base branch's entries but save only their own.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-${{ runner.arch }}-
    # Restored entries would otherwise accumulate from run to run.
    - shell: bash
      run: echo "TURBO_CACHE_MAX_AGE=7d" >> "$GITHUB_ENV"
