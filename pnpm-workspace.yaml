packages:
  - packages/*
  - apps/*
  - examples/*
  - tooling/*

# Keep installed dependency versions exact and centrally managed.
savePrefix: ''
catalogMode: strict
catalogPrune: true
engineStrict: true

# Each package must supply its own development/test copies of peers.
autoInstallPeers: false
strictPeerDependencies: true
resolvePeersFromWorkspaceRoot: false

# Add runtime, testing, examples and peers catalogs as needed; see AGENTS.md.
catalogs:
  tooling:
    turbo: 2.11.7
