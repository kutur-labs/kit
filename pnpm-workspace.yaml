packages:
  - packages/*
  - apps/*
  - tooling/*
  - integration-tests

# Pin dependency versions in catalogs.
savePrefix: ""
catalogMode: strict
catalogPrune: true
engineStrict: true

# Fail installs on versions outside exact catalog entries and on release-age
# exclusions that are not exact.
pnpmfile:
  - packages/strict/pnpmfile.mjs

# Drop release-age exclusions that the lockfile no longer uses.
minimumReleaseAgeExcludePrune: true

# Require each package to install its own peers for development and tests.
autoInstallPeers: false
strictPeerDependencies: true
resolvePeersFromWorkspaceRoot: false
peerDependencyRules:
  # @effect/platform-node requires redis for its NodeRedis module alone,
  # which no workspace imports; they import the modules they use directly.
  ignoreMissing:
    - redis
  allowedVersions:
    # capnp-es, from alchemy's Cloudflare runtime, uses TypeScript only in
    # its schema compiler, which no workspace runs.
    capnp-es>typescript: "7"

# Catalog usage is documented in AGENTS.md.
catalogs:
  runtime:
    "@tanstack/react-router": 1.170.46
    "@tanstack/react-start": 1.169.4
    "@tanstack/start-static-server-functions": 1.167.44
    fumadocs-core: 16.18.1
    fumadocs-mdx: 15.5.0
    fumadocs-ui: npm:@fumadocs/base-ui@16.18.1
    lucide-react: 1.70.0
    react: 19.3.1
    react-dom: 19.3.1
    zod: 4.6.7
    "@distilled.cloud/aws": 1.0.0-rc.18
    alchemy: 2.0.0-beta.85
    "@alchemy.run/cloudflare": 2.0.0-beta.85
    drizzle-orm: 1.0.0-rc.5
    effect: 4.1.2
    "@oxlint/plugins": 1.91.0
    eslint-plugin-sonarjs: 4.2.2
    eslint: 10.14.0
  tooling:
    "@tailwindcss/vite": 4.3.5
    "@vitejs/plugin-react": 6.2.1
    nitro: 3.0.261103-rc
    vite: 8.3.6
    "@types/mdx": 2.0.14
    "@types/react": 19.3.0
    "@types/react-dom": 19.3.0
    tailwindcss: 4.3.5
