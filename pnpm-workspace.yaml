packages:
  - packages/*
  - apps/*
  - tooling/*

# Pin dependency versions in catalogs.
savePrefix: ""
catalogMode: strict
catalogPrune: true
engineStrict: true

# Require each package to install its own peers for development and tests.
autoInstallPeers: false
strictPeerDependencies: true
resolvePeersFromWorkspaceRoot: false

# Catalog usage is documented in AGENTS.md.
catalogs:
  runtime:
    "@oxlint/plugins": 1.87.0
  tooling:
    konsistent: 1.0.0-beta.12
    "@commitlint/cli": 21.2.3
    "@commitlint/config-conventional": 21.2.3
    "@commitlint/types": 21.2.3
    husky: 9.1.7
    turbo: 2.11.7
    typescript: 7.0.2
    "@effect/tsgo": 0.51.1
    oxlint: 1.87.0
    oxlint-tsgolint: 7.0.2003
    oxfmt: 0.72.0
    publint: 0.3.25
    skills: 1.7.1
    "@types/node": 24.19.1
  peers:
    "@effect/tsgo": ~0.51.1
    oxlint: ~1.87.0
    oxfmt: ~0.72.0
