    tsrs: 0.22.0-ts7.1.0-beta
    "@effect/tsgo": 0.67.4
    oxlint: 1.91.0
    oxfmt: 0.77.0
    publint: 0.3.25
    skills: 1.7.6
    "@types/node": 26.6.6
  testing:
    "@effect/platform-node": 4.1.2
    "@effect/sql-pg": 4.1.2
    "@testcontainers/postgresql": 12.2.1
    testcontainers: 12.2.1
    "@effect/vitest": 4.1.2
    "@yielded/auth": 0.1.0-beta.47
    "@yielded/auth-persistence-drizzle": 0.1.0-beta.47
    "@stryker-mutator/core": 10.1.1
    "@stryker-mutator/vitest-runner": 10.1.1
    vitest: 5.1.0
    "@alchemy.run/test": 2.0.0-beta.85
  peers:
    "@distilled.cloud/aws": 1.0.0-rc.18
    alchemy: 2.0.0-beta.85
    "@alchemy.run/cloudflare": 2.0.0-beta.85
    drizzle-orm: 1.0.0-rc.5
    effect: ^4.1.2
    "@effect/tsgo": ~0.67.4
    oxlint: ~1.91.0
    oxfmt: ~0.77.0
allowBuilds:
  # Testcontainers works without these native and postinstall steps.
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
  # Miniflare runs workerd from its platform package; the script only checks it.
  workerd: false
minimumReleaseAgeExclude:
