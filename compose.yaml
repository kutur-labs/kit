# Optional long-running servers for tests, so runs skip starting containers:
# `pnpm db:up`, then TEST_POSTGRES_URL=postgres://kit:kit@localhost:54329/kit,
# and TEST_S3_ENDPOINT=http://localhost:9009 with TEST_S3_ACCESS_KEY_ID=kit
# and TEST_S3_SECRET_ACCESS_KEY=kit-secret.
services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: kit
      POSTGRES_PASSWORD: kit
      POSTGRES_DB: kit
    ports:
      - "54329:5432"
    # Test data is disposable, so it lives in memory.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kit", "-d", "kit"]
      interval: 1s
      timeout: 2s
      retries: 30
  rustfs:
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    environment:
      RUSTFS_ACCESS_KEY: kit
      RUSTFS_SECRET_KEY: kit-secret
    ports:
      - "9009:9000"
